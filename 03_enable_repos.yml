---
# Playbook 03: Enable RHEL 9 BaseOS and AppStream repositories
# Uses redhat.satellite collection

- name: Enable RHEL 9 Repositories
  hosts: satellite_server
  vars:
    satellite_server_url: "https://{{ satellite_hostname }}"
    satellite_admin_user: admin
    satellite_admin_pass: "{{ satellite_admin_password }}"
    organization: "{{ satellite_organization }}"
  tasks:
    - name: Enable RHEL 9 BaseOS repositories
      redhat.satellite.repository_set:
        username: "{{ satellite_admin_user }}"
        password: "{{ satellite_admin_pass }}"
        server_url: "{{ satellite_server_url }}"
        organization: "{{ organization }}"
        label: "rhel-9-for-x86_64-baseos-rpms"
        repositories:
          - basearch: "x86_64"
        state: enabled

    - name: Enable RHEL 9 AppStream repositories
      redhat.satellite.repository_set:
        username: "{{ satellite_admin_user }}"
        password: "{{ satellite_admin_pass }}"
        server_url: "{{ satellite_server_url }}"
        organization: "{{ organization }}"
        label: "rhel-9-for-x86_64-appstream-rpms"
        repositories:
          - basearch: "x86_64"
        state: enabled
