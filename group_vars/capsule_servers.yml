---
# Override these values in host_vars/<inventory-host>.yml when ansible_host is
# not the Capsule's DNS FQDN or when a Capsule has site-specific assignments.
capsule_fqdn: "{{ ansible_host | default(inventory_hostname) }}"
capsule_satellite_fqdn: >-
  {{ hostvars[groups['satellite_servers'] | first].satellite_hostname }}
capsule_satellite_url: "https://{{ capsule_satellite_fqdn }}"
capsule_certificate_archive_name: "{{ capsule_fqdn }}.tar.gz"
capsule_certificate_archive_path: "/root/{{ capsule_certificate_archive_name }}"
