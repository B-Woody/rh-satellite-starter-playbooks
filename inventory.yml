---

# Inventory for Red Hat Satellite playbooks
#
# Configure the Satellite server details below.
# Replace 'satellite.example.com' with the actual hostname or IP.

all:
  children:
    satellite_servers:
      hosts:
        satellite_server:
          ansible_host: satellite.example.com
          ansible_user: cloud-user
          ansible_port: 22
    capsule_servers:
      hosts:
        capsule01:
          ansible_host: capsule.example.com
          ansible_user: cloud-user
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3.9
